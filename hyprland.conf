# Ally OS base Hyprland config.
#
# This is the *base* config. Monitor rules, gaps, rounding, cursor size,
# blur, animations and the background logo are managed at runtime by
# Ally OS (config/lua/appearance.lua), so keep those out of your
# edits here. The values below are safe handheld-first boot defaults.

# --- Startup -----------------------------------------------------------
# Start the adaptive profile switcher (idempotent — also enabled as a user
# service; hyprland-launcher starts it before Hyprland is up).
exec-once = systemctl --user start hypr-profile-switch.service

# Solid dark backdrop; profile-specific wallpaper can be layered on later.
exec-once = swaybg -c '#0e1116'

# --- Environment -------------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Fallback appearance (handheld-first) ------------------------------
general {
    gaps_in = 12
    gaps_out = 24
    border_size = 3
    resize_on_border = true
}

decoration {
    rounding = 20
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

# --- Input -------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# --- Binds -------------------------------------------------------------
$mod = SUPER

# Launcher (mode-aware: handheld gets the touch grid, desktop the compact list)
bind = $mod, SPACE, exec, lua ~/.config/hypr/scripts/launcher.lua

# Virtual keyboard toggle (wvkbd; running in handheld mode)
bind = $mod, P, exec, systemctl --user is-active wvkbd >/dev/null 2>&1 && systemctl --user stop wvkbd || systemctl --user start wvkbd

# Manual profile override
bind = $mod SHIFT, H, exec, lua ~/.config/hypr/scripts/switch-profile.lua handheld
bind = $mod SHIFT, D, exec, lua ~/.config/hypr/scripts/switch-profile.lua desktop

# Terminal
bind = $mod, RETURN, exec, kitty

# Screenshots (grim + slurp + wl-clipboard)
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, PRINT, exec, grim - | wl-copy

# Lock
bind = $mod SHIFT, L, exec, hyprlock

# Window management
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, T, togglesplit
bind = $mod, V, togglefloating
bind = $mod, M, exit

# Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Audio
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness (internal panel; Ally X panel is amdgpu_bl1)
bind = , XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl1 set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl1 set 5%-

# Power profile (battery-conscious; profiles are also set per mode by
# enable-handheld.lua / enable-desktop.lua)
bind = $mod, B, exec, powerprofilesctl set power-saver
bind = $mod SHIFT, B, exec, powerprofilesctl set balanced

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
